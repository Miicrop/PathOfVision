name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $conf = (Get-Content app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ((Select-String -Path app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          if ($tag -ne $conf -or $tag -ne $cargo) { throw "Tag $tag, tauri.conf.json $conf, Cargo.toml $cargo must all match" }

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $notes = @()
          $in = $false
          foreach ($line in $lines) {
            if ($line -match '^##\s+(\S+)') {
              if ($in) { break }
              if ($Matches[1] -eq $version) { $in = $true; continue }
            }
            if ($in) { $notes += $line }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { throw "No CHANGELOG.md section for $version" }
          "body<<NOTES_EOF`n$text`nNOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Path of Vision ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
