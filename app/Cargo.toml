[package]
name = "pov-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pov-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
vision = { path = "../crates/vision" }
pov-core = { path = "../crates/core" }
pov-game = { path = "../crates/game" }
pov-capture = { path = "../crates/capture" }
pov-overlay = { path = "../crates/overlay" }
altar = { path = "../modules/altar" }

[dev-dependencies]
tempfile = "3"
