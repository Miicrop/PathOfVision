[package]
name = "ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
vision = { path = "../vision" }
windows = { version = "0.61", features = ["Media_Ocr", "Globalization", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
