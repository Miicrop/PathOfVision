[package]
name = "pov-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
pov-game = { path = "../game" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
