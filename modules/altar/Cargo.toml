[package]
name = "altar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
flate2 = "1.1"
vision = { path = "../../crates/vision" }
ocr = { path = "../../crates/ocr" }
rapidfuzz = "0.5"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pov-core = { path = "../../crates/core" }
pov-game = { path = "../../crates/game" }

[dev-dependencies]
tempfile = "3"
